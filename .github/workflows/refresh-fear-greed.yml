name: Refresh fear & greed index

on:
  schedule:
    # Hourly during market hours ET (UTC 13:00-21:00 covers both EDT/EST
    # with a small buffer), Monday-Friday only. CNN's index moves gradually
    # through the day, so hourly is plenty and keeps us light on their
    # unofficial/undocumented endpoint.
    - cron: "5 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-fear-greed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest fear & greed index
        run: node market_report/scripts/fetch-fear-greed.mjs

      - name: Commit data if changed
        run: |
          git config user.name "market-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market_report/data/fear-greed.json
          git diff --cached --quiet || git commit -m "Refresh fear & greed index"
          git push
