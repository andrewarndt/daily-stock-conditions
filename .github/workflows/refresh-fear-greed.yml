name: Refresh fear & greed index

on:
  schedule:
    # Twice daily, weekdays only: morning (13:10 UTC = ~9:10am ET) and
    # evening after close (21:10 UTC = ~5:10pm ET), both bounds covering
    # EDT/EST. Dropped from the original hourly cadence to cut down on
    # pulls against CNN's unofficial/undocumented endpoint.
    - cron: "10 13,21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-fear-greed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest fear & greed index
        run: node market_report/scripts/fetch-fear-greed.mjs

      - name: Commit data if changed
        run: |
          git config user.name "market-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market_report/data/fear-greed.json
          git diff --cached --quiet || git commit -m "Refresh fear & greed index"
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (attempt $attempt), rebasing onto latest main..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push after retries" >&2
          exit 1
