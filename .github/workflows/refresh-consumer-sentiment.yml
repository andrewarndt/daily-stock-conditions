name: Refresh consumer sentiment

# BACKUP trigger. market-session.yml's loop is the primary refresher; this run goes through the
# same due check, validation and cross-checks (session-loop.mjs --only) and restarts the loop if none is running.

on:
  schedule:
    # Once per weekday, mid-morning ET (14:10 UTC = 10:10am EDT / 9:10am
    # EST). UMCSENT is monthly (preliminary mid-month, final month-end), so
    # most runs are no-ops -- the git diff --quiet guard below handles that,
    # same as every other FRED-backed refresh here. Staggered 10 min after
    # refresh-economic.yml so the two don't hit FRED at the same instant.
    - cron: "10 14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # restart the session loop if none is running

concurrency:
  group: refresh-consumer-sentiment
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Refresh consumer-sentiment if due (validated)
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "market-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          node market_report/scripts/session-loop.mjs --only=consumer-sentiment
