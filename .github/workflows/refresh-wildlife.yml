name: Refresh wildlife photo manifest

on:
  push:
    branches: [main]
    paths:
      - "Wildlife Photos/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-wildlife
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate park manifest from folders
        run: node wildlife/scripts/generate-manifest.mjs

      - name: Commit manifest if changed
        run: |
          git config user.name "wildlife-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add wildlife/data/parks.json
          git diff --cached --quiet || git commit -m "Refresh wildlife photo manifest"
          git push
