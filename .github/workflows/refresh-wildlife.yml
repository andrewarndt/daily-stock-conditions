name: Refresh wildlife photo manifest

on:
  push:
    branches: [main]
    paths:
      - "Wildlife Photos/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-wildlife
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: pip install Pillow

      - name: Regenerate park manifest from folders
        run: node wildlife/scripts/generate-manifest.mjs

      - name: Regenerate fast-loading web copies of photos
        run: python wildlife/scripts/generate-web-images.py

      - name: Regenerate sitemap.xml (park galleries can change)
        run: node scripts/generate-sitemap.mjs

      - name: Commit manifest and web images if changed
        run: |
          git config user.name "wildlife-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add wildlife/data/parks.json wildlife/assets/web sitemap.xml
          git diff --cached --quiet || git commit -m "Refresh wildlife photo manifest and web images"
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (attempt $attempt), rebasing onto latest main..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push after retries" >&2
          exit 1
