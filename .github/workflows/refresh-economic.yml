name: Refresh economic data

# BACKUP trigger. market-session.yml's loop is the primary refresher; this run goes through the
# same due check, validation and cross-checks (session-loop.mjs --only) and restarts the loop if none is running.

on:
  schedule:
    # Once per weekday, mid-morning ET, well after BLS's standard 8:30am ET
    # release time for CPI/PPI/employment data (14:00 UTC = 10am EDT / 9am
    # EST -- buffer covers both). Monthly releases so most runs are no-ops;
    # committing is a no-op too when nothing changed (git diff --quiet guard).
    - cron: "0 14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # restart the session loop if none is running

concurrency:
  group: refresh-economic
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Refresh economic if due (validated)
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "market-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          node market_report/scripts/session-loop.mjs --only=economic
