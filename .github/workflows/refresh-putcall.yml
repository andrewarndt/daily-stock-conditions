name: Refresh put/call ratio

# BACKUP trigger. market-session.yml's loop is the primary refresher; this run goes through the
# same due check, validation and cross-checks (session-loop.mjs --only) and restarts the loop if none is running.

on:
  schedule:
    # Twice daily, weekdays only: morning (13:20 UTC = ~9:20am ET) and
    # evening after close (21:20 UTC = ~5:20pm ET), both bounds covering
    # EDT/EST. Cboe's stats are end-of-day, so the morning run mostly just
    # re-confirms the prior close -- the evening run is what actually picks
    # up that day's number. Staggered 10 min after refresh-fear-greed.yml
    # so the two workflows don't hit external endpoints at the same instant.
    - cron: "20 13,21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # restart the session loop if none is running

concurrency:
  group: refresh-putcall
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Refresh putcall if due (validated)
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "market-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          node market_report/scripts/session-loop.mjs --only=putcall
