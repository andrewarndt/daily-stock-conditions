name: Refresh sector ratios data

on:
  schedule:
    # Once per weekday, after market close (~21:15 UTC = 5:15pm EDT / 4:15pm
    # EST -- comfortable buffer in summer, tight but sufficient in winter).
    # This is end-of-day data, unlike the 30-min intraday overview refresh.
    - cron: "15 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-sector-ratios
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest sector ratio data
        run: node market_report/scripts/fetch-sector-ratios.mjs

      - name: Commit data if changed
        run: |
          git config user.name "market-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add market_report/data/sector-ratios.json
          git diff --cached --quiet || git commit -m "Refresh sector ratios data"
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (attempt $attempt), rebasing onto latest main..."
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push after retries" >&2
          exit 1
