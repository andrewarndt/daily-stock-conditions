name: Refresh volatility data

# BACKUP trigger. market-session.yml's loop is the primary refresher; this run goes through the
# same due check, validation and cross-checks (session-loop.mjs --only) and restarts the loop if none is running.

on:
  schedule:
    # Once per weekday, after market close (~21:25 UTC = 5:25pm EDT / 4:25pm
    # EST -- comfortable buffer in summer, tight but sufficient in winter).
    # Staggered 10 min after refresh-sector-ratios.yml so the two workflows
    # don't hit Cboe/Yahoo at the same instant. Cboe's historical CSVs are
    # end-of-day data, updated after their own close.
    - cron: "25 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  actions: write   # restart the session loop if none is running

concurrency:
  group: refresh-volatility
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Refresh volatility if due (validated)
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "market-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          node market_report/scripts/session-loop.mjs --only=volatility
