name: Market data health check

# Independent of the session loop: checks every Market Desk feed against its
# schedule, opens/updates/closes the "Market Desk data alert" issue, and
# starts the session loop if no run is active during market hours.

on:
  schedule:
    - cron: "17 12-23 * * 1-5"
    - cron: "17 0-3 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: node market_report/scripts/session-loop.mjs --health-only
