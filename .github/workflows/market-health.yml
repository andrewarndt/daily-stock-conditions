name: Market data health check

# Independent of the session loop: checks every Market Desk feed against its
# schedule, opens/updates/closes the "Market Desk data alert" issue, and
# restarts the session-loop chain whenever no run is active (any hour, any day).

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: write
  pages: write      # request a rebuild after clearing a stuck Pages deploy

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: node market_report/scripts/session-loop.mjs --health-only
