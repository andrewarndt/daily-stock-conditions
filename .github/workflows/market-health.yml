name: Market data health check

# The Market Desk alerter. Every 30 min it checks each feed against its
# schedule (plus the live website and the session loop's validation problems),
# restarts the session-loop chain if no run is active, and clears stuck Pages
# deploys. A problem that has lasted ~30 min FAILS this run once, and GitHub
# emails the failure. The same problem won't fail another run until it clears,
# so an outage is one email and recovery sends none. .health-state/ carries
# what was already emailed from run to run (actions/cache).

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write
  pages: write      # request a rebuild after clearing a stuck Pages deploy

concurrency:
  group: market-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: .health-state
          key: health-state-${{ github.run_id }}
          restore-keys: health-state-
      - name: Check feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: node market_report/scripts/session-loop.mjs --health-only
      - name: Save alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .health-state
          key: health-state-${{ github.run_id }}
