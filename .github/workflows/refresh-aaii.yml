name: Refresh AAII sentiment survey

# BACKUP trigger. market-session.yml's loop is the primary refresher; this run goes through the
# same due check, validation and cross-checks (session-loop.mjs --only) and restarts the loop if none is running.

on:
  schedule:
    # Once per weekday morning (12:40 UTC = ~8:40am ET, covers EDT/EST).
    # AAII only publishes a new number once a week, but the source page
    # sits behind occasional bot-protection challenges (see
    # fetch-aaii.mjs) -- a daily check costs little and gives more
    # chances to get through in the week a fresh number posts.
    - cron: "40 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  actions: write   # restart the session loop if none is running

concurrency:
  group: refresh-aaii
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Refresh aaii if due (validated)
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "market-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          node market_report/scripts/session-loop.mjs --only=aaii
