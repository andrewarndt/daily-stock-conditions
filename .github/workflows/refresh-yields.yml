name: Refresh Treasury yields

# BACKUP trigger. market-session.yml's loop is the primary refresher; this run goes through the
# same due check, validation and cross-checks (session-loop.mjs --only) and restarts the loop if none is running.

on:
  schedule:
    # Once per weekday, evening ET, after Treasury publishes its daily par
    # yield table (~3:30pm ET) and FRED mirrors it (21:30 UTC = 5:30pm EDT /
    # 4:30pm EST -- buffer covers both). Committing is a no-op when nothing
    # changed (git diff --quiet guard).
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  actions: write   # restart the session loop if none is running

concurrency:
  group: refresh-yields
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Refresh yields if due (validated)
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "market-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          node market_report/scripts/session-loop.mjs --only=yields
