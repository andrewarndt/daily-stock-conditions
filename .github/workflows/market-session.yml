name: Market session loop

# One long-running job keeps every GitHub-fed Market Desk file current
# through the day (market_report/scripts/session-loop.mjs decides what is
# due from each file's own dates). A run lasts up to ~5.75 h; several
# triggers a day, plus the local "Market Desk Refresh Dispatch" task, make
# sure one is always running even when GitHub drops scheduled triggers.
# Overlapping triggers queue behind the running loop instead of doubling it.

on:
  schedule:
    - cron: "0 11 * * 1-5"   # 6-7 AM ET
    - cron: "30 13 * * 1-5"
    - cron: "0 16 * * 1-5"
    - cron: "30 18 * * 1-5"
    - cron: "0 21 * * 1-5"
    - cron: "30 23 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-session
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run session loop
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          git config user.name "market-desk-bot"
          git config user.email "actions@users.noreply.github.com"
          node market_report/scripts/session-loop.mjs
