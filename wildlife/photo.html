<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SS82YDJ0GN"></script>

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

<title>Photo — Wildlife Photography</title>
<meta name="description" content="View a wildlife photo up close and ask about a print.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="assets/style.css?v=9">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="home-link" href="../">&larr; 4A Holdings Company</a>
    <a class="brand" href="index.html"><img class="brand-icon" src="assets/brand/wildlife-icon.png" alt="">Wildlife <span>Photography</span></a>
    <span class="home-link-spacer" aria-hidden="true">&larr; 4A Holdings Company</span>
  </div>
</div>

<div class="page photo-page">
  <a class="back-link" id="back-link" href="index.html">&larr; Back to the gallery</a>

  <figure class="photo-view" id="photo-view">
    <div class="photo-stage">
      <img id="photo-img" alt="" hidden>
      <a class="photo-nav prev" id="photo-prev" aria-label="Previous photo" hidden>&#8249;</a>
      <a class="photo-nav next" id="photo-next" aria-label="Next photo" hidden>&#8250;</a>
    </div>
    <figcaption>
      <span class="photo-park" id="photo-park">Loading&hellip;</span>
      <span class="photo-meta" id="photo-meta"></span>
    </figcaption>
  </figure>

  <section class="room-preview" id="room-preview" hidden>
    <div class="room-head">
      <h2>See it on your wall</h2>
      <div class="room-tabs" role="tablist" aria-label="Room"></div>
    </div>
    <div class="room-stage">
      <img class="room-bg" alt="">
      <div class="room-print"><img alt="Your selected photo as a framed print"></div>
    </div>
    <div class="room-controls">
      <div class="room-orient" aria-label="Orientation"></div>
      <div class="room-sizes" aria-label="Print size"></div>
    </div>
    <p class="room-note"></p>
  </section>

  <section class="contact-card interest-card" id="interest">
    <div class="interest-head">
      <img id="interest-thumb" alt="" hidden>
      <div>
        <h2>Interested in a print of this photo?</h2>
        <p>Send me a note and I'll email you about sizes, paper, and pricing. Nothing is charged.</p>
      </div>
    </div>
    <form class="inquiry-form print-interest-form" novalidate>
      <label>Your name<input name="name" type="text" autocomplete="name" required></label>
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <label class="full"><span>Phone <span class="opt">optional</span></span><input name="phone" type="tel" autocomplete="tel"></label>
      <label class="full"><span>Notes <span class="opt">optional</span></span><textarea name="message" rows="4" placeholder="Size you have in mind, framing, a gift note, a date you need it by, questions..."></textarea></label>
      <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="full actions">
        <button type="submit" class="contact-button">Send my interest</button>
        <p class="inquiry-status" role="status" aria-live="polite"></p>
      </div>
    </form>
    <p class="contact-direct">Questions? <a id="interest-email" href="#"></a></p>
  </section>
</div>

<script src="/assets/inquiry.js?v=1"></script>
<script src="assets/parks.js?v=7"></script>
<script src="assets/room-preview.js?v=3"></script>
<script>
  // photo.html?park=<slug>&photo=<filename>: one photo large, arrows to the
  // rest of that park's photos, and a print-interest form for this photo.
  const params = new URLSearchParams(location.search);
  const form = document.querySelector(".print-interest-form");
  const emailLink = document.getElementById("interest-email");
  emailLink.href = "mailto:" + CONTACT_EMAIL;
  emailLink.textContent = CONTACT_EMAIL;
  let current = null; // { park, filename }
  let preview = null; // room preview, once the photo is known

  function notFound(msg) {
    document.getElementById("photo-park").textContent = msg;
    document.getElementById("interest").hidden = true;
  }

  loadParks().then((parks) => {
    const park = parkBySlug(parks, params.get("park"));
    if (!park) return notFound("Photo not found");
    const back = document.getElementById("back-link");
    back.href = galleryUrl(park);
    back.innerHTML = "&larr; Back to " + escapeHtml(park.name);
    const i = park.photos.indexOf(params.get("photo"));
    if (i < 0) return notFound("Photo not found");

    const filename = park.photos[i];
    current = { park, filename };
    const src = webPhotoUrl(park, filename);
    const img = document.getElementById("photo-img");
    img.src = src;
    img.alt = `${park.name} wildlife photo ${i + 1}`;
    img.hidden = false;
    preview = initRoomPreview(document.getElementById("room-preview"), src);
    const thumb = document.getElementById("interest-thumb");
    thumb.src = src;
    thumb.hidden = false;
    document.getElementById("photo-park").textContent = park.name;
    document.getElementById("photo-meta").textContent =
      [park.location, `Photo ${i + 1} of ${park.photos.length}`].filter(Boolean).join(" · ");
    document.title = `${park.name} — Photo ${i + 1} — Wildlife Photography`;

    const n = park.photos.length;
    if (n > 1) {
      const prev = document.getElementById("photo-prev"), next = document.getElementById("photo-next");
      prev.href = photoPageUrl(park, park.photos[(i - 1 + n) % n]);
      next.href = photoPageUrl(park, park.photos[(i + 1) % n]);
      prev.hidden = next.hidden = false;
      document.addEventListener("keydown", (e) => {
        if (e.target.closest("input, textarea, select")) return;
        if (e.key === "ArrowLeft") location.href = prev.href;
        if (e.key === "ArrowRight") location.href = next.href;
      });
    }
  }).catch((err) => {
    console.error("Failed to load parks:", err);
    notFound("Couldn't load this photo right now. Try refreshing.");
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const f = form.elements;
    const status = form.querySelector(".inquiry-status");
    const send = form.querySelector('button[type="submit"]');
    if (!current) return;
    const missing = [f.name, f.email].filter((el) => !el.value.trim());
    if (missing.length) {
      status.textContent = "Please add your name and email.";
      missing[0].focus();
      return;
    }
    if (!f.email.checkValidity()) {
      status.textContent = "That email doesn't look right.";
      f.email.focus();
      return;
    }
    const { park, filename } = current;
    status.textContent = "Sending…";
    send.disabled = true;
    sendInquiry("Print interest: " + park.name, {
      "Name": f.name.value.trim(),
      "Email": f.email.value.trim(),
      "Phone": f.phone.value.trim(),
      "Photo": park.name + " — " + filename,
      "Photo link": new URL(webPhotoUrl(park, filename), location.href).href,
      "Photo page": location.href,
      "Size viewed in wall preview": preview ? preview.describe() : "-",
      "Notes": f.message.value.trim(),
    }, f._honey.value)
      .then(() => {
        form.reset();
        status.textContent = "Thank you! I'll email you soon about your print.";
      })
      .catch((err) => {
        console.warn("Print interest: send failed", err);
        status.textContent = `That didn't go through. Please email ${CONTACT_EMAIL} instead.`;
      })
      .finally(() => { send.disabled = false; });
  });
</script>

<script src="/assets/site-links.js?v=2" defer></script>
</body>
</html>
