<title>Gallery — Wildlife Photography</title>
<meta name="description" content="Wildlife photography galleries by national park, from real trips. Full-resolution prints available.">
<link rel="canonical" href="https://4aholdingscompany.com/wildlife/gallery.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Gallery — Wildlife Photography">
<meta property="og:description" content="Wildlife photography galleries by national park, from real trips. Full-resolution prints available.">
<meta property="og:url" content="https://4aholdingscompany.com/wildlife/gallery.html">
<meta property="og:image" content="https://4aholdingscompany.com/wildlife/assets/web/Everglades%20National%20Park%2C%20Florida/IMG_7093.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="home-link" href="../index.html">&larr; 4A Holdings Company</a>
    <a class="brand" href="index.html"><img class="brand-icon" src="assets/brand/wildlife-icon.png" alt="">Wildlife <span>Photography</span></a>
    <span class="home-link-spacer" aria-hidden="true">&larr; 4A Holdings Company</span>
  </div>
</div>

<div class="giveback-banner">
  🌿 <strong>10% of the profit</strong> from every print sold goes back to the park where it was taken — helping keep these places wild for generations to come.
</div>

<div class="page">
  <a class="back-link" href="index.html">&larr; All parks</a>
  <div class="page-head">
    <h1 id="park-title">Loading&hellip;</h1>
    <p id="park-subtitle"></p>
  </div>

  <div id="quality-note-slot"></div>

  <div id="photo-grid" class="photo-grid"></div>

  <div id="footer-slot"></div>
</div>

<script src="assets/parks.js"></script>
<script>
  const slug = new URLSearchParams(location.search).get("park");

  loadParks().then((parks) => {
    const park = parkBySlug(parks, slug);
    const titleEl = document.getElementById("park-title");
    const subtitleEl = document.getElementById("park-subtitle");
    const gridEl = document.getElementById("photo-grid");
    document.getElementById("footer-slot").outerHTML = contactFooterHtml();
    document.getElementById("quality-note-slot").outerHTML = photoQualityNoteHtml();

    if (!park) {
      titleEl.textContent = "Park not found";
      subtitleEl.textContent = "";
      gridEl.outerHTML = '<div class="empty-state">That park doesn\'t exist. <a href="index.html">Back to all parks &rarr;</a></div>';
      return;
    }

    titleEl.textContent = park.name;
    subtitleEl.textContent = park.location;
    document.title = park.name + " — Wildlife Photography";
    updateGallerySeo(park);

    if (park.photos.length === 0) {
      gridEl.outerHTML = '<div class="empty-state">No photos posted yet for this park &mdash; check back soon.</div>';
      return;
    }

    gridEl.innerHTML = park.photos.map((filename) => {
      const fullUrl = photoUrl(park, filename);
      const webUrl = webPhotoUrl(park, filename);
      return `<a href="${fullUrl}" target="_blank" rel="noopener"><img src="${webUrl}" alt="${escapeHtml(park.name)} wildlife photo" loading="lazy"></a>`;
    }).join("");
  });
</script>

</body>
</html>
