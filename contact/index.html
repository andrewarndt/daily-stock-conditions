    border-radius: 1.25rem;
    box-shadow: 0 24px 50px -30px var(--lift);
  }
  .photo {
    width: 7.5rem; height: 7.5rem;
    margin: 0 auto 1rem;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--gold);
    box-shadow: 0 0 0 5px var(--surface), 0 0 0 6px var(--gold-line);
  }
  h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 1.85rem; letter-spacing: -0.01em; }
  .org { margin: 0.3rem 0 0; color: var(--gold); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; }
  .save {

    text-decoration: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease;

  .save:hover, .save:focus-visible { transform: translateY(-1px); box-shadow: 0 12px 24px -12px var(--lift); }
  .save:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .save svg { width: 1.15rem; height: 1.15rem; }
  .status { min-height: 1.3em; margin: 0 0 1.2rem; color: var(--muted); font-size: 0.82rem; }
  .actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.5rem; }
  .actions a {
    display: flex; flex-direction: column; align-items: center; gap: 0.35rem;
    padding: 0.75rem 0.25rem 0.6rem;
    border: 1px solid var(--rule); border-radius: 0.9rem;
    color: var(--fg); text-decoration: none; font-size: 0.75rem;
    transition: border-color 0.2s ease;
  }
  .actions a:hover, .actions a:focus-visible { border-color: var(--gold-line); }
  .actions svg { width: 1.25rem; height: 1.25rem; color: var(--gold); }
  .details { margin: 1.25rem 0 0; padding: 1rem 0 0; border-top: 1px solid var(--rule); list-style: none; text-align: left; font-size: 0.9rem; }
  .details li { display: flex; justify-content: space-between; gap: 1rem; padding: 0.3rem 0; }
  .details span { color: var(--muted); }
  .details a { color: var(--fg); text-decoration: none; overflow-wrap: anywhere; text-align: right; }
  footer { margin-top: 1.5rem; text-align: center; font-size: 0.85rem; }

<script>
  // Open the contact card as soon as the page loads (on iPhone this shows the
  // "Add to Contacts" sheet). Only once per visit, so coming back to this page
  // doesn't pop it up again; the button always works.
  (function () {
    var status = document.getElementById("status");
    var seen = false;
    try { seen = sessionStorage.getItem("vcf-opened") === "1"; } catch (e) {}
    if (seen) { status.textContent = "Tap Save contact to add me to your contacts."; return; }
    try { sessionStorage.setItem("vcf-opened", "1"); } catch (e) {}
    status.textContent = "Opening contact card…";
    setTimeout(function () {
      window.location.href = "/contact.vcf";
      setTimeout(function () { status.textContent = "Didn't open? Tap Save contact."; }, 1500);
    }, 700);
  })();
</script>
