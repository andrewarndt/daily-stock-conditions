<title>4A Holdings Company</title>
<meta name="description" content="4A Holdings Company: a live daily market conditions dashboard, a small store and event items, and vending machine services in the Columbus and Cincinnati area.">
<link rel="canonical" href="https://4aholdingscompany.com/">
<meta property="og:type" content="website">
<meta property="og:title" content="4A Holdings Company">
<meta property="og:description" content="A live daily market conditions dashboard, a small store and event items, and vending machine services in the Columbus and Cincinnati area.">
<meta property="og:url" content="https://4aholdingscompany.com/">
<meta property="og:image" content="https://4aholdingscompany.com/images/logo-mark.png">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf9f7;
    --fg: #1b1b1a;
    --muted: #77756f;
    --rule: #e4e1da;
    --gold: #b08040;
    --hero-fg: #061a33;
    --hero-top: #fdfcf9;
    --hero-bottom: #f6f3ec;
    --hero-glow: rgba(181, 138, 69, 0.13);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121211;
      --fg: #eeece7;
      --muted: #8f8c85;
      --rule: #2b2a28;
      --gold: #c79a58;
      --hero-fg: #eeece7;
      --hero-top: #171615;
      --hero-bottom: #121211;
      --hero-glow: rgba(199, 154, 88, 0.14);
    }
  }
  * { box-sizing: border-box; }
  /* Scale the whole page with the window: 16px root up to 1600px wide,
     then 1vw (capped), so every rem-based size grows on large monitors
     instead of leaving the page in a narrow strip. Same rule as Market Desk. */
  html { font-size: clamp(16px, 1vw, 36px); }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- logo + name ---------- */
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 1.5rem 2.5rem;
    text-align: center;
    color: var(--hero-fg);
    background:
      radial-gradient(44rem 22rem at 50% 30%, var(--hero-glow), transparent 70%),
      linear-gradient(to bottom, var(--hero-top), var(--hero-bottom));
  }
  .hero .mark { width: clamp(6.5rem, 18vw, 10rem); height: auto; margin-bottom: 1.25rem; }
  .hero h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(2rem, 6vw, 3.4rem);
    letter-spacing: 0.02em;
    line-height: 1.1;
  }
  .hero .rule { width: 3.5rem; height: 1px; margin: 1.1rem auto 0; background: var(--gold); }

  /* ---------- photo tiles: each photo is the link to its section ---------- */
  /* Five equal tiles in one row across the screen; one column on phones. */
  .tiles {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 0.6rem;
    max-width: 90rem;
    margin: 0 auto;
    padding: 0.6rem 0.6rem 3rem;
  }
  .tile {
    position: relative;
    display: block;
    overflow: hidden;
    aspect-ratio: 2 / 3;
    background: #1b1b1a;
    color: #fff;
    text-decoration: none;
  }
  .tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.9s cubic-bezier(.2,.7,.2,1), filter 0.6s ease;
  }
  .tile::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.18) 38%, transparent 60%);
    transition: background 0.5s ease;
  }
  .tile .label {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 1;
    padding: 1.2rem 1.1rem 1.1rem;
  }
  .tile .eyebrow {
    display: block;
    margin-bottom: 0.35rem;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #e9c98f;
  }
  .tile .name {
    display: block;
    font-family: var(--serif);
    font-size: clamp(1.15rem, 1.75vw, 1.7rem);
    line-height: 1.15;
    text-shadow: 0 2px 14px rgba(0,0,0,0.35);
  }
  .tile .name::after { content: "\2192"; display: inline-block; margin-left: 0.45rem; font-family: var(--sans); font-size: 0.7em; transition: transform 0.4s ease; }
  .tile:hover img, .tile:focus-visible img { transform: scale(1.05); }
  .tile:hover .name::after, .tile:focus-visible .name::after { transform: translateX(0.35rem); }
  .tile:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  /* vending art is wider than the tile: show it whole on its own navy */
  .tile.vending { background: linear-gradient(to bottom, #061a35, #081d3c 55%, #0a2244); }
  .tile.vending img { object-fit: contain; object-position: 50% 30%; }
  .tile.store img { object-position: 50% 50%; }
  .tile.events img { object-position: 50% 62%; }
  .tile.wildlife img { object-position: 47% 40%; }
  @media (max-width: 760px) {
    .tiles { grid-template-columns: minmax(0, 1fr); gap: 0.5rem; padding: 0.5rem 0.5rem 2rem; }
    .tile { aspect-ratio: 4 / 3; }
    .tile .name { font-size: 1.5rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile img, .tile .name::after { transition: none; }
  }
</style>
</head>
<body>
<header class="hero">
  <img class="mark" src="images/logo-mark.png" alt="4A Holdings logo" width="608" height="493">
  <h1>4A Holdings Company</h1>
  <div class="rule"></div>
</header>

<main class="tiles">
  <a class="tile wildlife" href="wildlife/">
    <img src="wildlife/assets/web/Kumana%20National%20Park%2C%20Sri%20Lanka/IMG_3929-2.jpg" alt="Leopard in Kumana National Park, Sri Lanka">
    <span class="label"><span class="eyebrow">Photography</span><span class="name">Wildlife Prints</span></span>
  </a>
  <a class="tile store" href="store/">
    <img src="images/home/store.jpg" alt="Laser-engraved ceramic reed diffuser">
    <span class="label"><span class="eyebrow">Store</span><span class="name">Shop the Store</span></span>
  </a>
  <a class="tile events" href="wedding-vessels/">
    <img src="wedding-vessels/assets/images/vessel-table-setting.jpg" alt="Engraved diffuser centerpiece on a reception table" loading="lazy">
    <span class="label"><span class="eyebrow">Event Decor</span><span class="name">Event Centerpieces</span></span>
  </a>
  <a class="tile vending" href="vending/">
    <img src="images/home/vending.jpg" alt="Two stocked vending machines" loading="lazy">
    <span class="label"><span class="eyebrow">Services</span><span class="name">Vending Machine Services</span></span>
  </a>
  <a class="tile market" href="market_report/">
    <img src="images/home/market-report.jpg" alt="Market breadth charts from the Market Report" loading="lazy">
    <span class="label"><span class="eyebrow">Dashboard</span><span class="name">Market Report</span></span>
  </a>
</main>

<script src="/assets/site-links.js?v=2" defer></script>
</body>
</html>
