<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4A Holdings Company</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #5b5b5b;
    --accent: #1f5eff;
    --border: #e2e2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214;
      --fg: #f2f2f2;
      --muted: #a5a5a5;
      --accent: #6d93ff;
      --border: #2a2b2e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 2rem;
  }
  main {
    max-width: 44rem;
    text-align: center;
  }
  h1 {
    font-size: 2rem;
    margin: 0 0 0.5rem;
  }
  p {
    color: var(--muted);
    line-height: 1.5;
  }
  .sections {
    margin-top: 2.5rem;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
    gap: 1.25rem;
    text-align: left;
  }
  a.card {
    display: block;
    padding: 1.5rem;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    color: var(--fg);
    text-decoration: none;
  }
  a.card:hover {
    border-color: var(--accent);
  }
  a.card .eyebrow {
    display: block;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }
  a.card h2 {
    margin: 0 0 0.4rem;
    font-size: 1.15rem;
  }
  a.card p {
    margin: 0;
    font-size: 0.9rem;
  }
  a.card:hover h2 {
    color: var(--accent);
  }
</style>
</head>
<body>
<main>
  <h1>4A Holdings Company</h1>
  <p>Two things live here for now.</p>
  <div class="sections">
    <a class="card" href="market_report/index.html">
      <span class="eyebrow">Finance</span>
      <h2>Market Report →</h2>
      <p>Daily market overview, sentiment, and economic data.</p>
    </a>
    <a class="card" href="wildlife/index.html">
      <span class="eyebrow">Photography</span>
      <h2>Wildlife Photography →</h2>
      <p>Galleries from national parks, organized by location.</p>
    </a>
  </div>
</main>
</body>
</html>
