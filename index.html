<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4A Holdings Company</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #5b5b5b;
    --accent: #1f5eff;
    --border: #e2e2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214;
      --fg: #f2f2f2;
      --muted: #a5a5a5;
      --accent: #6d93ff;
      --border: #2a2b2e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 2rem;
  }
  main {
    max-width: 32rem;
    text-align: center;
  }
  h1 {
    font-size: 2rem;
    margin: 0 0 0.5rem;
  }
  p {
    color: var(--muted);
    line-height: 1.5;
  }
  .links {
    margin-top: 2rem;
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  a.button {
    display: inline-block;
    padding: 0.65rem 1.25rem;
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    color: var(--fg);
    text-decoration: none;
  }
  a.button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
</style>
</head>
<body>
<main>
  <h1>4A Holdings Company</h1>
  <p>Site under construction. Check back soon.</p>
  <div class="links">
    <a class="button" href="market_report/index.html">Market Report →</a>
  </div>
</main>
</body>
</html>
